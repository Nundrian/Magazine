name: Release validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: python -m pip install --requirement requirements-test.txt
      - run: python -m pip install --editable .
      - run: python scripts/verify_release.py

  image-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: integrations/open_webui/frontend
          file: integrations/open_webui/frontend/Dockerfile
          push: false
          tags: magazine-open-webui:0.1.0-beta.4
