<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="2500" viewBox="0 0 1560 2500" role="img" aria-labelledby="title description">
  <title id="title">Illustrated example of the Magazine Simple workflow interface</title>
  <desc id="description">A reconstructed, generic Open WebUI Magazine page. Numbered arrows explain choosing and importing workflows, selecting models and tools, preparing, starting and monitoring a run. This is not a real screenshot.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#e8eff7"/>
    </linearGradient>
    <linearGradient id="window" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#111929"/>
      <stop offset="1" stop-color="#0e1728"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#397add"/>
    </marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .heading{fill:#192d49;font-size:37px;font-weight:750}
      .subtitle{fill:#536781;font-size:21px}
      .u-head{fill:#f3f6ff;font-size:27px;font-weight:730}
      .u-section{fill:#f3f6ff;font-size:23px;font-weight:730}
      .u-label{fill:#e2e8f7;font-size:20px;font-weight:620}
      .u-body{fill:#cbd6e9;font-size:19px}
      .u-muted{fill:#a4b2ca;font-size:17px}
      .u-small{fill:#aebbd1;font-size:16px}
      .u-green{fill:#86dab5;font-size:18px}
      .ctl{fill:#1b263b;stroke:#5a6984;stroke-width:1.5}
      .ctltext{fill:#e1e9f9;font-size:19px}
      .button{fill:#a7c7ff;stroke:#a7c7ff;stroke-width:1.5}
      .buttontext{fill:#12274c;font-size:19px;font-weight:700}
      .outline{fill:#1a253a;stroke:#61718e;stroke-width:1.5}
      .outlinetext{fill:#e1e9fb;font-size:18px;font-weight:620}
      .notebox{fill:#ffffff;stroke:#c8d8eb;stroke-width:1.5}
      .notehead{fill:#244670;font-size:22px;font-weight:750}
      .notetext{fill:#526780;font-size:19px}
      .arrowline{fill:none;stroke:#397add;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .badgecircle{fill:#397add;stroke:#d2e5ff;stroke-width:3}
      .badgenum{fill:#ffffff;font-size:21px;font-weight:750;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>

  <rect width="1560" height="2500" fill="url(#page)"/>
  <text x="62" y="67" class="heading">Magazine Simple — illustrated interface</text>
  <text x="62" y="106" class="subtitle">One continuous example page, reconstructed from the four reference views.</text>
  <rect x="1212" y="42" width="288" height="48" rx="24" fill="#d6e6fa"/>
  <text x="1356" y="73" text-anchor="middle" fill="#315782" font-size="18" font-weight="730">ILLUSTRATION · NOT A SCREENSHOT</text>

  <!-- Reconstructed application shell -->
  <rect x="68" y="165" width="1070" height="2260" rx="22" fill="#c5d2e2" opacity="0.8"/>
  <rect x="60" y="155" width="1070" height="2260" rx="22" fill="url(#window)"/>
  <text x="95" y="209" class="u-head">Magazine</text>
  <text x="759" y="209" class="u-muted">Appearance</text>
  <rect x="874" y="178" width="216" height="42" rx="7" class="outline"/>
  <text x="891" y="206" class="u-small">Follow Open WebUI</text>
  <path d="M1072 193l7 7 7-7" fill="none" stroke="#dbe8fb" stroke-width="2"/>

  <!-- Workflow catalogue -->
  <rect x="90" y="273" width="1010" height="590" rx="13" fill="#172135" stroke="#52627f" stroke-width="1.5"/>
  <text x="118" y="318" class="u-section">Your workflows</text>
  <rect x="942" y="291" width="128" height="33" rx="17" fill="#1c3340" stroke="#466c70"/>
  <text x="1006" y="313" text-anchor="middle" fill="#88d7ad" font-size="16">1 workflow</text>
  <text x="118" y="365" class="u-label">Workflow</text>
  <rect x="118" y="382" width="572" height="53" rx="6" class="ctl"/>
  <text x="134" y="416" class="ctltext">Example website review — 6 steps</text>
  <path d="M664 402l9 9 9-9" fill="none" stroke="#becae0" stroke-width="2.5"/>
  <rect x="710" y="382" width="203" height="53" rx="6" class="button"/>
  <text x="811" y="415" text-anchor="middle" class="buttontext">Load your workflow</text>
  <rect x="931" y="382" width="139" height="53" rx="6" class="outline"/>
  <text x="1000" y="415" text-anchor="middle" class="outlinetext">Refresh list</text>
  <text x="118" y="465" class="u-muted">Choose a saved workflow and load it before setting up the run.</text>
  <text x="118" y="497" class="u-green">Workflow loaded. Choose models below.</text>
  <text x="118" y="540" class="u-muted">▸  Delete workflows</text>
  <text x="118" y="586" class="u-label">▾  Add a workflow</text>
  <text x="118" y="630" class="u-label">Workflow ZIP</text>
  <rect x="118" y="646" width="330" height="52" rx="7" class="ctl"/>
  <rect x="129" y="658" width="104" height="28" rx="5" class="outline"/>
  <text x="181" y="678" text-anchor="middle" fill="#eef4ff" font-size="17">Browse…</text>
  <text x="249" y="679" class="u-muted">example.zip</text>
  <text x="118" y="733" class="u-label">Short name (optional)</text>
  <rect x="118" y="748" width="317" height="43" rx="6" class="ctl"/>
  <text x="135" y="777" class="u-muted">Website review</text>
  <rect x="118" y="803" width="183" height="43" rx="6" class="outline"/>
  <text x="209" y="831" text-anchor="middle" class="outlinetext">Add a workflow</text>
  <text x="468" y="831" class="u-green">Imported workflows are shared; runs remain private.</text>

  <!-- Model, terminal and tool controls -->
  <rect x="90" y="895" width="1010" height="840" rx="13" fill="#172135" stroke="#52627f" stroke-width="1.5"/>
  <text x="118" y="945" class="u-section">Set up</text>
  <text x="118" y="977" class="u-muted">6 steps run in order, each in a fresh chat.</text>
  <text x="118" y="1014" class="u-label">Workflow steps — 6</text>
  <rect x="992" y="988" width="77" height="31" rx="16" fill="#203940" stroke="#4c7774"/>
  <text x="1030" y="1009" text-anchor="middle" fill="#8ee2b0" font-size="16">in order</text>
  <text x="118" y="1063" class="u-body">AI model selection</text>
  <rect x="118" y="1080" width="480" height="47" rx="6" class="ctl"/>
  <text x="137" y="1110" class="ctltext">Use the same model for all steps</text>
  <path d="M568 1097l8 9 8-9" fill="none" stroke="#bfcbe1" stroke-width="2.5"/>
  <text x="118" y="1170" class="u-body">AI model for all steps</text>
  <rect x="118" y="1188" width="630" height="48" rx="6" class="ctl"/>
  <text x="136" y="1220" class="ctltext">Local model — example selection</text>
  <path d="M715 1207l9 9 9-9" fill="none" stroke="#bfcbe1" stroke-width="2.5"/>
  <text x="118" y="1284" class="u-label">Terminal for cartridge workers</text>
  <text x="118" y="1321" class="u-body">Native Open Terminal connection</text>
  <rect x="459" y="1292" width="232" height="45" rx="6" class="ctl"/>
  <text x="475" y="1321" class="ctltext">Open Terminal</text>
  <path d="M663 1308l9 9 9-9" fill="none" stroke="#bfcbe1" stroke-width="2.5"/>
  <text x="118" y="1366" class="u-muted">Choose an available connection for this run.</text>
  <text x="118" y="1410" class="u-label">Tools for this workflow</text>
  <rect x="979" y="1385" width="91" height="33" rx="16" fill="#203940" stroke="#4c7774"/>
  <text x="1024" y="1407" text-anchor="middle" fill="#8ee2b0" font-size="16">3 found</text>
  <text x="118" y="1458" class="u-muted">Tools selected: 3 of 3</text>
  <rect x="325" y="1428" width="108" height="40" rx="6" class="outline"/>
  <text x="379" y="1454" text-anchor="middle" class="outlinetext">Select all</text>
  <rect x="449" y="1428" width="109" height="40" rx="6" class="outline"/>
  <text x="503" y="1454" text-anchor="middle" class="outlinetext">Clear all</text>
  <rect x="118" y="1485" width="295" height="78" rx="7" class="ctl"/>
  <rect x="134" y="1501" width="19" height="19" rx="3" fill="#3989e9"/>
  <path d="M138 1510l5 5 8-10" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="167" y="1517" fill="#e5edfc" font-size="16">Auto Approval</text>
  <text x="167" y="1545" class="u-small">Standard permissions</text>
  <rect x="425" y="1485" width="270" height="78" rx="7" class="ctl"/>
  <rect x="440" y="1501" width="19" height="19" rx="3" fill="#3989e9"/>
  <path d="M444 1510l5 5 8-10" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="473" y="1517" fill="#e5edfc" font-size="16">Fresh Worker</text>
  <text x="473" y="1545" class="u-small">Isolated model chats</text>
  <rect x="707" y="1485" width="363" height="78" rx="7" class="ctl"/>
  <rect x="722" y="1501" width="19" height="19" rx="3" fill="#3989e9"/>
  <path d="M726 1510l5 5 8-10" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="755" y="1517" fill="#e5edfc" font-size="16">Development Toolkit</text>
  <text x="755" y="1545" class="u-small">Development tools</text>
  <text x="118" y="1595" class="u-muted">Tools are not selected by default. Choose only what the workflow needs.</text>
  <rect x="118" y="1614" width="208" height="52" rx="7" class="button"/>
  <text x="222" y="1647" text-anchor="middle" class="buttontext">Prepare workflow</text>
  <text x="118" y="1701" class="u-green">Your workflow is ready. Nothing has started.</text>

  <!-- Prepared run with illustrative progress -->
  <rect x="90" y="1765" width="1010" height="605" rx="13" fill="#202c43" stroke="#576984" stroke-width="1.5"/>
  <text x="118" y="1811" class="u-section">Example website review — 6 steps</text>
  <rect x="986" y="1784" width="84" height="35" rx="18" fill="#253e4c" stroke="#76939d"/>
  <text x="1028" y="1808" text-anchor="middle" fill="#bfecdd" font-size="17">Running</text>
  <text x="118" y="1852" class="u-small">Run reference: EXAMPLE-001  ·  Work folder: /workspace/example-run</text>
  <text x="118" y="1882" class="u-small">Terminal: Open Terminal  ·  Tools: 3 selected</text>
  <text x="118" y="1930" fill="#e0e9f8" font-size="21">2 of 6 steps finished. Working on c03_content.</text>
  <rect x="118" y="1951" width="952" height="10" rx="5" fill="#56627b"/>
  <rect x="118" y="1951" width="317" height="10" rx="5" fill="#79b6ff"/>
  <text x="118" y="2014" class="u-body">1. c01_structure</text>
  <text x="538" y="2014" fill="#83dfb4" font-size="19">finished</text>
  <text x="118" y="2051" class="u-body">2. c02_navigation</text>
  <text x="538" y="2051" fill="#83dfb4" font-size="19">finished</text>
  <text x="118" y="2088" class="u-body">3. c03_content</text>
  <text x="538" y="2088" fill="#a5cbff" font-size="19">running</text>
  <text x="118" y="2125" class="u-body">4. c04_accessibility</text>
  <text x="538" y="2125" class="u-muted">waiting</text>
  <text x="118" y="2162" class="u-body">5. c05_testing</text>
  <text x="538" y="2162" class="u-muted">waiting</text>
  <text x="118" y="2199" class="u-body">6. c06_handover</text>
  <text x="538" y="2199" class="u-muted">waiting</text>
  <rect x="118" y="2240" width="185" height="51" rx="6" fill="#202a3d" stroke="#50617a" stroke-dasharray="5 4"/>
  <text x="210" y="2273" text-anchor="middle" fill="#8b99b1" font-size="18" font-weight="620">Start workflow</text>
  <rect x="316" y="2240" width="191" height="51" rx="6" class="outline"/>
  <text x="411" y="2273" text-anchor="middle" class="outlinetext">Stop workflow</text>
  <rect x="519" y="2240" width="195" height="51" rx="6" class="outline"/>
  <text x="616" y="2273" text-anchor="middle" class="outlinetext">Check progress</text>
  <text x="118" y="2332" class="u-muted">The Start button is disabled here because this example run is already running.</text>

  <!-- Explanatory arrows and notes; each connects to the appropriate UI area -->
  <g>
    <path class="arrowline" d="M1165 374L1119 374L1095 405"/>
    <circle cx="1079" cy="405" r="21" class="badgecircle"/><text x="1079" y="406" class="badgenum">1</text>
    <rect x="1165" y="330" width="331" height="103" rx="12" class="notebox"/>
    <text x="1186" y="365" class="notehead">1 · Load a workflow</text>
    <text x="1186" y="395" class="notetext">Choose a saved ZIP-based</text>
    <text x="1186" y="419" class="notetext">workflow and load its steps.</text>
  </g>
  <g>
    <path class="arrowline" d="M1165 497L1124 497L1094 462"/>
    <circle cx="1079" cy="453" r="21" class="badgecircle"/><text x="1079" y="454" class="badgenum">2</text>
    <rect x="1165" y="454" width="331" height="94" rx="12" class="notebox"/>
    <text x="1186" y="487" class="notehead">2 · Refresh list</text>
    <text x="1186" y="518" class="notetext">Update the catalogue of</text>
    <text x="1186" y="541" class="notetext">available workflows.</text>
  </g>
  <g>
    <path class="arrowline" d="M1165 702L1128 702L1097 706"/>
    <circle cx="1079" cy="706" r="21" class="badgecircle"/><text x="1079" y="707" class="badgenum">3</text>
    <rect x="1165" y="648" width="331" height="126" rx="12" class="notebox"/>
    <text x="1186" y="683" class="notehead">3 · Import a new ZIP</text>
    <text x="1186" y="713" class="notetext">Add a package containing</text>
    <text x="1186" y="737" class="notetext">magazine.yaml and prompts.</text>
    <text x="1186" y="761" class="notetext">Runs stay owner-private.</text>
  </g>
  <g>
    <path class="arrowline" d="M1165 1075L1129 1075L1097 1104"/>
    <circle cx="1079" cy="1115" r="21" class="badgecircle"/><text x="1079" y="1116" class="badgenum">4</text>
    <rect x="1165" y="1025" width="331" height="125" rx="12" class="notebox"/>
    <text x="1186" y="1061" class="notehead">4 · Select models</text>
    <text x="1186" y="1091" class="notetext">Use one model for all steps</text>
    <text x="1186" y="1116" class="notetext">or assign one per cartridge.</text>
  </g>
  <g>
    <path class="arrowline" d="M1165 1302L1131 1302L1098 1320"/>
    <circle cx="1079" cy="1329" r="21" class="badgecircle"/><text x="1079" y="1330" class="badgenum">5</text>
    <rect x="1165" y="1255" width="331" height="111" rx="12" class="notebox"/>
    <text x="1186" y="1291" class="notehead">5 · Connect Terminal</text>
    <text x="1186" y="1321" class="notetext">Choose a native Terminal</text>
    <text x="1186" y="1345" class="notetext">connection for worker tasks.</text>
  </g>
  <g>
    <path class="arrowline" d="M1165 1490L1130 1490L1098 1515"/>
    <circle cx="1079" cy="1523" r="21" class="badgecircle"/><text x="1079" y="1524" class="badgenum">6</text>
    <rect x="1165" y="1440" width="331" height="114" rx="12" class="notebox"/>
    <text x="1186" y="1476" class="notehead">6 · Choose tools</text>
    <text x="1186" y="1505" class="notetext">Tick the tools needed for</text>
    <text x="1186" y="1531" class="notetext">this run; none are preselected.</text>
  </g>
  <g>
    <path class="arrowline" d="M1165 1660L1130 1660L1096 1635"/>
    <circle cx="1079" cy="1625" r="21" class="badgecircle"/><text x="1079" y="1626" class="badgenum">7</text>
    <rect x="1165" y="1606" width="331" height="125" rx="12" class="notebox"/>
    <text x="1186" y="1642" class="notehead">7 · Prepare the run</text>
    <text x="1186" y="1671" class="notetext">Save model and tool choices.</text>
    <text x="1186" y="1696" class="notetext">Status becomes READY;</text>
    <text x="1186" y="1720" class="notetext">execution has not begun.</text>
  </g>
  <g>
    <path class="arrowline" d="M1165 1902L1129 1902L1097 1916"/>
    <circle cx="1079" cy="1921" r="21" class="badgecircle"/><text x="1079" y="1922" class="badgenum">8</text>
    <rect x="1165" y="1846" width="331" height="140" rx="12" class="notebox"/>
    <text x="1186" y="1882" class="notehead">8 · Watch run status</text>
    <text x="1186" y="1912" class="notetext">See the reference, selected</text>
    <text x="1186" y="1937" class="notetext">tools, progress and current</text>
    <text x="1186" y="1962" class="notetext">cartridge.</text>
  </g>
  <g>
    <path class="arrowline" d="M1165 2092L1131 2092L1097 2110"/>
    <circle cx="1079" cy="2117" r="21" class="badgecircle"/><text x="1079" y="2118" class="badgenum">9</text>
    <rect x="1165" y="2040" width="331" height="113" rx="12" class="notebox"/>
    <text x="1186" y="2075" class="notehead">9 · Inspect each step</text>
    <text x="1186" y="2106" class="notetext">Finished, running and waiting</text>
    <text x="1186" y="2130" class="notetext">are shown in execution order.</text>
  </g>
  <g>
    <path class="arrowline" d="M1165 2280L1130 2280L1097 2270"/>
    <circle cx="1079" cy="2263" r="21" class="badgecircle"/><text x="1079" y="2264" class="badgenum">10</text>
    <rect x="1165" y="2205" width="331" height="149" rx="12" class="notebox"/>
    <text x="1186" y="2240" class="notehead">10 · Control execution</text>
    <text x="1186" y="2270" class="notetext">Start from READY, request</text>
    <text x="1186" y="2295" class="notetext">Stop, or refresh progress.</text>
    <text x="1186" y="2320" class="notetext">Stop is not Pause/Resume.</text>
  </g>

  <text x="64" y="2465" fill="#5b7190" font-size="18">Illustrative data only · Magazine Simple 0.2.0 local interface concept · Open WebUI edition</text>
</svg>
