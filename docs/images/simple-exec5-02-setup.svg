th="1"/><text x="74" y="586" font-size="18" fill="#172849" font-weight="700">Prepare workflow</text><path class="link" d="M884 220 L850 220 L850 188 L815 188"/><circle cx="902" cy="214" r="17" fill="#367bd7"/><text x="902" y="220" fill="#fff" text-anchor="middle" font-size="17" font-weight="bold">1</text><text x="930" y="220" class="note">Workflow steps ▾</text><text x="900" y="251" class="body">Expand cartridges; use one model for all or</text><text x="900" y="271" class="body">per-step selections.</text><path class="link" d="M884 344 L850 344 L850 286 L815 286"/><circle cx="902" cy="338" r="17" fill="#367bd7"/><text x="902" y="344" fill="#fff" text-anchor="middle" font-size="17" font-weight="bold">2</text><text x="930" y="344" class="note">Model information ▸</text><text x="900" y="375" class="body">Expand a reference-only list of available</text><text x="900" y="395" class="body">models.</text><path class="link" d="M884 468 L850 468 L850 384 L815 384"/><circle cx="902" cy="462" r="17" fill="#367bd7"/><text x="902" y="468" fill="#fff" text-anchor="middle" font-size="17" font-weight="bold">3</text><text x="930" y="468" class="note">Terminal ▾ and tools</text><text x="900" y="499" class="body">One Terminal choice per run; no tools</text><text x="900" y="519" class="body">ticked by default.</text><path class="link" d="M884 592 L850 592 L850 531 L815 531"/><circle cx="902" cy="586" r="17" fill="#367bd7"/><text x="902" y="592" fill="#fff" text-anchor="middle" font-size="17" font-weight="bold">4</text><text x="930" y="592" class="note">Prepare</text><text x="900" y="623" class="body">Creates READY without starting execution.</text><text x="32" y="741" font-size="13" fill="#97b6df">Reconstructed from reference screenshots • Example data • Not a captured application screenshot</text></svg>