<rect x="866" y="113" width="380" height="603" rx="18" fill="#111c30" stroke="#526b8b"/><text x="896" y="150" font-size="20" fill="#a8d4ff" font-weight="bold">What the controls do</text><rect x="56" y="168" width="756" height="41" rx="7" fill="#1b293e" stroke="#607694" stroke-width="1"/><text x="74" y="194" font-size="16" fill="#e8f1ff" font-weight="400">Acceptance line (3-step)                       READY</text><rect x="56" y="217" width="756" height="41" rx="7" fill="#1b293e" stroke="#607694" stroke-width="1"/><text x="74" y="243" font-size="16" fill="#e8f1ff" font-weight="400">Run reference: EXAMPLE-001</text><rect x="56" y="266" width="756" height="41" rx="7" fill="#1b293e" stroke="#607694" stroke-width="1"/><text x="74" y="292" font-size="16" fill="#e8f1ff" font-weight="400">0 of 3 steps finished. ━━━━━━━━━━━━━━━</text><rect x="56" y="315" width="756" height="41" rx="7" fill="#1b293e" stroke="#607694" stroke-width="1"/><text x="74" y="341" font-size="16" fill="#e8f1ff" font-weight="400">1. c01_value     waiting</text><rect x="56" y="364" width="756" height="41" rx="7" fill="#1b293e" stroke="#607694" stroke-width="1"/><text x="74" y="390" font-size="16" fill="#e8f1ff" font-weight="400">2. c02_file      waiting</text><rect x="56" y="413" width="756" height="41" rx="7" fill="#1b293e" stroke="#607694" stroke-width="1"/><text x="74" y="439" font-size="16" fill="#e8f1ff" font-weight="400">3. c03_verify    waiting</text><rect x="56" y="462" width="756" height="41" rx="7" fill="#a7c8ff" stroke="#607694" stroke-width="1"/><text x="74" y="488" font-size="18" fill="#172849" font-weight="700">Start workflow   Stop workflow   Check progress</text><rect x="56" y="511" width="756" height="41" rx="7" fill="#2a3c57" stroke="#607694" stroke-width="1"/><text x="74" y="537" font-size="18" fill="#e8f1ff" font-weight="700">▾ Ledger</text><rect x="56" y="560" width="756" height="41" rx="7" fill="#1b293e" stroke="#607694" stroke-width="1"/><text x="74" y="586" font-size="16" fill="#e8f1ff" font-weight="400">#   Step               Model                 Status</text><path class="link" d="M884 220 L850 220 L850 188 L815 188"/><circle cx="902" cy="214" r="17" fill="#367bd7"/><text x="902" y="220" fill="#fff" text-anchor="middle" font-size="17" font-weight="bold">1</text><text x="930" y="220" class="note">READY status</text><text x="900" y="251" class="body">A prepared run does not start itself.</text><path class="link" d="M884 369 L850 369 L850 335 L815 335"/><circle cx="902" cy="363" r="17" fill="#367bd7"/><text x="902" y="369" fill="#fff" text-anchor="middle" font-size="17" font-weight="bold">2</text><text x="930" y="369" class="note">Start / Stop / Progress</text><text x="900" y="400" class="body">Start explicit execution; Stop requests a</text><text x="900" y="420" class="body">safe stop.</text><path class="link" d="M884 518 L850 518 L850 482 L815 482"/><circle cx="902" cy="512" r="17" fill="#367bd7"/><text x="902" y="518" fill="#fff" text-anchor="middle" font-size="17" font-weight="bold">3</text><text x="930" y="518" class="note">Ledger ▾</text><text x="900" y="549" class="body">Expand the per-step evidence table.</text><text x="32" y="741" font-size="13" fill="#97b6df">Reconstructed from reference screenshots • Example data • Not a captured application screenshot</text></svg>