<style>text{font-family:"Segoe UI",Arial,sans-serif}.main{font-size:32px;font-weight:bold;fill:#ffffff}.small{font-size:16px;fill:#c4d5f0}.row{font-size:18px;fill:#e8f1ff}.note{font-size:18px;font-weight:bold;fill:#152b4f}.body{font-size:14px;fill:#455e80}.link{fill:none;stroke:#68adff;stroke-width:3;marker-end:url(#arrow)}.plate{fill:#172337;stroke:#607592;stroke-width:2}.control{fill:#202e44;stroke:#617692;stroke-width:1.5}</style></defs>
