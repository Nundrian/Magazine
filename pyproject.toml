[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magazine"
version = "0.1.0"
description = "Deterministic sequential executor for pre-designed workflow cartridges"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
include = ["magazine*"]
